<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reshmanth-Surisetti</title>
  <style>
    :root {
      --bg: #f2f4f8;
      --panel: #ffffff;
      --line: #dce2ec;
      --ink: #20283a;
      --muted: #7b8496;
      --accent: #526ee8;
      --accent-dark: #405bd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }
    .topbar {
      min-height: 76px;
      padding: 16px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; flex-direction: column; gap: 4px; }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    button:active { transform: translateY(1px); }
    .pip-button { background: #202b45; color: white; }
    .pip-button:hover { background: #111a2d; }
    .page { max-width: 1500px; margin: 0 auto; padding: 24px 26px 36px; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 17px;
    }
    .toolbar-title { font-size: 14px; font-weight: 700; }
    .toolbar-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 18px;
    }
    .section-counter { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .section-card {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 15px;
      box-shadow: 0 5px 18px rgba(27, 39, 64, .045);
    }
    .section-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }
    .section-label {
      width: 100%;
      min-width: 0;
      height: 40px;
      border: 1px solid #cfd6e3;
      border-radius: 7px;
      padding: 0 11px;
      color: var(--ink);
      background: #fbfcff;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .section-label:focus, .writing-field:focus {
      border-color: #8295f1;
      box-shadow: 0 0 0 3px rgba(82, 110, 232, .10);
    }
    .section-number {
      flex: 0 0 auto;
      color: #929bad;
      font-size: 11px;
      font-weight: 700;
    }
    .close-section {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #e5cfd2;
      border-radius: 7px;
      background: #fff7f7;
      color: #bd4b55;
      font-size: 19px;
      line-height: 1;
    }
    .close-section:hover {
      background: #fdebed;
      border-color: #e7b9be;
    }
    .fields { display: flex; flex-direction: column; gap: 10px; }
    .field-row { display: flex; align-items: stretch; gap: 7px; }
    .writing-field {
      width: 100%;
      min-width: 0;
      min-height: 62px;
      resize: vertical;
      border: 1px solid #dce2ec;
      border-radius: 7px;
      padding: 10px 11px;
      background: #fff;
      color: #273149;
      font: 13px/1.5 Inter, Arial, sans-serif;
      outline: none;
    }
    .copy-button {
      align-self: stretch;
      flex: 0 0 37px;
      width: 37px;
      padding: 0;
      border: 1px solid #dce2ec;
      background: #f4f6fb;
      color: #58657e;
      font-size: 16px;
      border-radius: 7px;
    }
    .copy-button:hover { background: #e9edfa; color: var(--accent-dark); }
    .copy-button.copied { background: #e4f5ec; color: #21875a; border-color: #b9e4cb; }
    .add-card {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1.5px dashed #bfc9dc;
      border-radius: 13px;
      background: rgba(255,255,255,.55);
      color: #64718a;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }
    .add-card:hover { border-color: var(--accent); background: #fff; color: var(--accent-dark); }
    .plus {
      width: 43px; height: 43px; display: grid; place-items: center;
      border: 1.5px solid currentColor; border-radius: 50%; font-size: 27px; line-height: 1;
    }
    .add-card strong { font-size: 13px; }
    .add-card span:last-child { font-size: 11px; color: var(--muted); }
    .footer-note { margin-top: 16px; color: var(--muted); font-size: 11px; text-align: right; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 15px; border-radius: 8px; background: #202b45; color: white;
      font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.16);
      opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 30;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 950px) {
      .sections-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .topbar { padding: 13px 15px; }
      .brand h1 { font-size: 16px; }
      .page { padding: 18px 14px 28px; }
      .sections-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Reshmanth's Writing Workspace</h1>
      <p>Organize your content into sections and copy each text instantly.</p>
    </div>
    <div class="top-actions">
      <button class="pip-button" id="pipButton" type="button">▣PIP</button>
    </div>
  </header>

  <main class="page">
    <div class="toolbar">
      <div>
        <div class="toolbar-title">MY workspce</div>
        <div class="toolbar-note">Add sections below</div>
      </div>
      <div class="section-counter" id="sectionCount">0 / 6 sections added</div>
    </div>

    <div class="sections-grid" id="sectionsGrid"></div>
    <div class="footer-note">This is the end of sctions</div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const MAX_SECTIONS = 6;
    const FIELDS_PER_SECTION = 8;
    const sections = Array(MAX_SECTIONS).fill(null);
    let pipWindow = null;

    const grid = document.getElementById("sectionsGrid");
    const sectionCount = document.getElementById("sectionCount");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1700);
    }

    async function copyText(text, button) {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (error) {}

      if (!copied) {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.left = "-9999px";
        document.body.appendChild(helper);
        helper.focus();
        helper.select();
        try { copied = document.execCommand("copy"); } catch (error) {}
        helper.remove();
      }

      if (copied) {
        const original = button.textContent;
        button.textContent = "✓";
        button.classList.add("copied");
        showToast("Text copied to clipboard");
        setTimeout(() => {
          button.textContent = original;
          button.classList.remove("copied");
        }, 1200);
      } else {
        showToast("Clipboard blocked by browser. Try Chrome or Edge and allow clipboard access.");
      }
    }

    function createSection() {
      return { heading: "", values: Array(FIELDS_PER_SECTION).fill("") };
    }

    function render() {
      grid.innerHTML = "";

      sections.forEach((section, sectionIndex) => {
        if (!section) {
          const add = document.createElement("button");
          add.className = "add-card";
          add.type = "button";
          add.setAttribute("aria-label", `Add section ${sectionIndex + 1}`);
          add.innerHTML = `
            <span class="plus">+</span>
            <strong>Add Section</strong>
            <span>Click to create section ${sectionIndex + 1}</span>
          `;
          add.addEventListener("click", () => {
            sections[sectionIndex] = createSection();
            render();
            const heading = grid.querySelector(`[data-section-heading="${sectionIndex}"]`);
            if (heading) heading.focus();
          });
          grid.appendChild(add);
          return;
        }

        const card = document.createElement("section");
        card.className = "section-card";

        const labelRow = document.createElement("div");
        labelRow.className = "section-label-row";

        const label = document.createElement("input");
        label.className = "section-label";
        label.type = "text";
        label.placeholder = "Label: Enter section heading";
        label.value = section.heading;
        label.dataset.sectionHeading = sectionIndex;
        label.setAttribute("aria-label", `Section ${sectionIndex + 1} heading`);
        label.addEventListener("input", () => {
          section.heading = label.value;
          renderPipPreview();
        });

        const number = document.createElement("span");
        number.className = "section-number";
        number.textContent = `${sectionIndex + 1}/6`;

        const close = document.createElement("button");
        close.className = "close-section";
        close.type = "button";
        close.textContent = "×";
        close.title = `Close section ${sectionIndex + 1}`;
        close.setAttribute("aria-label", `Close section ${sectionIndex + 1}`);
        close.addEventListener("click", () => {
          sections[sectionIndex] = null;
          render();
          showToast(`Section ${sectionIndex + 1} closed`);
        });

        labelRow.append(label, number, close);
        card.appendChild(labelRow);

        const fields = document.createElement("div");
        fields.className = "fields";

        section.values.forEach((value, fieldIndex) => {
          const row = document.createElement("div");
          row.className = "field-row";

          const textarea = document.createElement("textarea");
          textarea.className = "writing-field";
          textarea.placeholder = `Writing text ${fieldIndex + 1}`;
          textarea.value = value;
          textarea.setAttribute("aria-label", `Section ${sectionIndex + 1}, writing text ${fieldIndex + 1}`);
          textarea.addEventListener("input", () => {
            section.values[fieldIndex] = textarea.value;
            renderPipPreview();
          });

          const copy = document.createElement("button");
          copy.className = "copy-button";
          copy.type = "button";
          copy.title = "Copy this text";
          copy.setAttribute("aria-label", `Copy writing text ${fieldIndex + 1}`);
          copy.textContent = "▣";
          copy.addEventListener("click", () => copyText(textarea.value, copy));

          row.append(textarea, copy);
          fields.appendChild(row);
        });

        card.appendChild(fields);
        grid.appendChild(card);
      });

      const added = sections.filter(Boolean).length;
      sectionCount.textContent = `${added} / ${MAX_SECTIONS} sections added`;
      renderPipPreview();
    }

    function renderPipPreview() {
      if (!pipWindow || pipWindow.closed) return;
      const previewGrid = pipWindow.document.getElementById("pipSections");
      if (!previewGrid) return;

      previewGrid.innerHTML = "";
      sections.forEach((section, index) => {
        if (!section) return;

        const card = pipWindow.document.createElement("section");
        card.className = "preview-section";

        const heading = pipWindow.document.createElement("div");
        heading.className = "preview-heading";
        heading.textContent = section.heading.trim() || `Section ${index + 1}`;
        card.appendChild(heading);

        const list = pipWindow.document.createElement("div");
        list.className = "preview-fields";
        section.values.forEach((value, fieldIndex) => {
          const row = pipWindow.document.createElement("div");
          row.className = "preview-row";

          const item = pipWindow.document.createElement("div");
          item.className = "preview-field";
          item.textContent = value.trim() || "";
          item.title = value || `Writing text ${fieldIndex + 1}`;

          const copy = pipWindow.document.createElement("button");
          copy.className = "preview-copy";
          copy.type = "button";
          copy.textContent = "▣";
          copy.title = `Copy full text ${fieldIndex + 1}`;
          copy.setAttribute("aria-label", `Copy full text ${fieldIndex + 1}`);
          copy.addEventListener("click", async () => {
            let copied = false;
            try {
              if (pipWindow.navigator.clipboard && pipWindow.isSecureContext) {
                await pipWindow.navigator.clipboard.writeText(value);
                copied = true;
              }
            } catch (error) {}

            if (!copied) {
              try {
                const helper = pipWindow.document.createElement("textarea");
                helper.value = value;
                helper.setAttribute("readonly", "");
                helper.style.position = "fixed";
                helper.style.left = "-9999px";
                pipWindow.document.body.appendChild(helper);
                helper.focus();
                helper.select();
                helper.setSelectionRange(0, helper.value.length);
                copied = pipWindow.document.execCommand("copy");
                helper.remove();
              } catch (error) {}
            }

            if (copied) {
              copy.textContent = "✓";
              copy.classList.add("copied");
              setTimeout(() => {
                if (copy.isConnected) {
                  copy.textContent = "▣";
                  copy.classList.remove("copied");
                }
              }, 1200);
            } else {
              copy.title = "Clipboard blocked by browser";
              copy.textContent = "!";
            }
          });

          row.append(item, copy);
          list.appendChild(row);
        });
        card.appendChild(list);
        previewGrid.appendChild(card);
      });

      const emptyCount = sections.filter(section => !section).length;
      if (sections.every(section => !section)) {
        const empty = pipWindow.document.createElement("div");
        empty.className = "preview-empty";
        empty.textContent = "Add sections on the main page to see them here.";
        previewGrid.appendChild(empty);
      }
    }

    render();

    document.getElementById("pipButton").addEventListener("click", async () => {
      if (!("documentPictureInPicture" in window)) {
        showToast("Picture-in-Picture requires a recent Chrome or Edge browser.");
        return;
      }
      try {
        if (pipWindow && !pipWindow.closed) { pipWindow.focus(); return; }
        pipWindow = await window.documentPictureInPicture.requestWindow({ width: 540, height: 520 });
        const doc = pipWindow.document;
        doc.open();
        doc.write(`<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Floating Writing Preview</title>
          </head>
          <body>
            <header class="pip-header">
              <strong>Writing Workspace</strong>
              <span>LIVE PREVIEW</span>
            </header>
            <main id="pipSections" class="pip-sections" aria-live="polite"></main>
          </body>
          </html>`);
        doc.close();

        const style = doc.createElement("style");
        style.textContent = `
          * { box-sizing: border-box; }
          html, body { width:100%; height:100%; margin:0; }
          body {
            padding: 10px;
            overflow-y: auto;
            background: #f1f3f7;
            color: #253047;
            font-family: Arial, Helvetica, sans-serif;
          }
          .pip-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
            padding: 8px 3px 10px;
            margin-bottom: 8px;
            background:#f1f3f7;
            border-bottom:1px solid #dce2ec;
            font-size:12px;
          }
          .pip-header span {
            color:#8791a3;
            font-size:9px;
            font-weight:700;
            letter-spacing:.7px;
          }
          .pip-sections {
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            align-items:start;
            gap:8px;
          }
          .preview-section {
            min-width:0;
            padding:7px;
            background:#fff;
            border:1px solid #dce2ec;
            border-radius:8px;
            box-shadow:0 2px 7px rgba(25,35,55,.04);
          }
          .preview-heading {
            width:100%;
            margin:0 0 7px;
            padding:4px 5px;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
            border:1px solid #dce2ec;
            border-radius:5px;
            background:#f8f9fc;
            color:#273149;
            font-size:10px;
            font-weight:700;
          }
          .preview-fields { display:flex; flex-direction:column; gap:5px; }
          .preview-row { display:flex; align-items:center; gap:3px; min-width:0; }
          .preview-field {
            flex:1 1 auto;
            width:0;
            min-width:0;
            height:22px;
            padding:4px 5px;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
            border:1px solid #e1e5ed;
            border-radius:5px;
            background:#fff;
            color:#566176;
            font-size:9px;
            line-height:12px;
          }
          .preview-copy {
            flex:0 0 22px;
            width:22px;
            height:22px;
            padding:0;
            display:grid;
            place-items:center;
            border:1px solid #dce2ec;
            border-radius:5px;
            background:#f4f6fb;
            color:#58657e;
            font-size:11px;
            cursor:pointer;
          }
          .preview-copy:hover { background:#e9edfa; color:#405bd0; }
          .preview-copy.copied { background:#e4f5ec; color:#21875a; border-color:#b9e4cb; }
          .preview-empty {
            grid-column:1 / -1;
            padding:25px 10px;
            color:#8a93a4;
            text-align:center;
            font-size:11px;
          }
          @media (max-width: 260px) {
            body { padding:6px; }
            .pip-sections { gap:4px; }
            .preview-section { padding:4px; }
            .preview-field { height:19px; padding:3px; font-size:8px; }
            .preview-copy { flex-basis:19px; width:19px; height:19px; font-size:10px; }
            .preview-heading { font-size:9px; padding:3px; }
          }
        `;
        doc.head.appendChild(style);

        pipWindow.addEventListener("pagehide", () => { pipWindow = null; });
        renderPipPreview();
      } catch (error) {
        pipWindow = null;
        showToast("Could not open Picture-in-Picture. Please try again.");
      }
    });
  </script>
</body>
</html>
